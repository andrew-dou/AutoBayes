[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobayes"
version = "0.5.0"
description = "brms-like Bayesian hierarchical models on PyMC with a JAX/NumPyro device path (M0 Gaussian, M1 Bernoulli, M2 binomial counts, M3a-1 categorical predictors, M3a-2 numeric-by-categorical interaction, M3b-1 independent varying slope)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# The tested stack, pinned exactly. Every result in docs/ was produced with these versions
# (plus the ones in uv.lock); a different version is an untested combination, not a
# supported one. Upgrades are deliberate slices with their own evidence.
dependencies = [
  "pymc==5.28.5",
  "pytensor==2.38.3",
  "bambi==0.17.2",
  "formulae==0.6.2",
  "arviz==0.23.4",
  "numpy==2.4.6",
  "pandas==3.0.5",
  "scipy==1.17.1",
  "xarray==2026.7.0",
  "matplotlib==3.10.9",
]

[project.optional-dependencies]
jax = ["jax==0.10.2", "jaxlib==0.10.2", "numpyro==0.21.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["autobayes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: sampling runs that take more than a few seconds"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]
